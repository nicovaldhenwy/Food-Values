<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Trade</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090b10;color:#f5f5f7;
  font-family:Arial,sans-serif
}
header{
  padding:20px 16px 12px;
  background:#10131b;border-bottom:1px solid #272b36
}
.brand{font-size:25px;font-weight:800;letter-spacing:-.7px}
.subtitle{color:#9299aa;font-size:13px;margin-top:5px}
nav{display:flex;gap:8px;margin-top:18px}
nav button{
  flex:1;padding:12px;border:1px solid #303544;
  border-radius:9px;background:#191d28;color:#bbbfd0;
  font-weight:bold
}
nav button.active{background:#f04444;color:white;border-color:#f04444}
main{padding:16px;max-width:900px;margin:auto}
h2{font-size:21px;margin:8px 0}
.muted{color:#9399aa;font-size:13px}
.search{
  width:100%;padding:13px;margin:17px 0 10px;
  background:#141822;color:white;border:1px solid #303544;
  border-radius:9px;font-size:15px;outline:none
}
.controls{display:flex;gap:9px;margin-bottom:16px}
select{
  flex:1;min-width:0;padding:11px 8px;
  color:white;background:#141822;border:1px solid #303544;
  border-radius:8px
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.food-card{
  position:relative;text-align:left;color:white;
  background:#121620;border:1px solid #292e3b;
  border-radius:12px;padding:12px;min-width:0
}
.food-card:active{background:#202635}
.food-art{
  height:90px;display:flex;align-items:center;justify-content:center;
  font-size:52px;background:#1b202d;border-radius:9px;
  margin-bottom:11px
}
.rarity{
  position:absolute;top:18px;right:18px;
  font-size:10px;font-weight:bold;padding:5px 7px;
  border-radius:6px;background:#222;color:white
}
.Mythical{color:#ff7777;border:1px solid #c83b48}
.Legendary{color:#ffdc65;border:1px solid #b99425}
.Rare{color:#d1a0ff;border:1px solid #8851ba}
.Uncommon{color:#79bdff;border:1px solid #347ebc}
.Common{color:#d0d0d0;border:1px solid #626773}
.food-name{font-weight:bold;font-size:14px;line-height:1.3;min-height:36px}
.value{font-size:21px;font-weight:800;margin:7px 0}
.demand-label{font-size:11px;color:#a4aabb;display:flex;justify-content:space-between}
.bar{height:5px;background:#2b3040;border-radius:9px;margin-top:7px;overflow:hidden}
.fill{height:100%;background:#f04444;border-radius:9px}
button{cursor:pointer}
.detail-top{display:flex;align-items:center;gap:15px;margin:20px 0}
.detail-art{
  width:120px;height:120px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:65px;background:#1b202d;border-radius:14px
}
.detail-value{font-size:34px;font-weight:800;margin:15px 0}
.panel{background:#121620;border:1px solid #292e3b;border-radius:12px;padding:16px;margin-top:12px}
.back{
  padding:10px 14px;background:#202532;border:1px solid #353b4a;
  color:white;border-radius:8px;margin:8px 0
}
.hidden{display:none!important}
label{display:block;color:#b3b8c7;font-size:13px;margin:12px 0 6px}
input,select{font-size:14px}

/* Calculator Slot Styles */
.calc-sides-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
@media(max-width: 650px) {
  .calc-sides-wrapper { grid-template-columns: 1fr; }
}
.slots-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.trade-slot {
  background: #151922;
  border: 1px solid #292e3b;
  border-radius: 10px;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  padding: 6px;
  text-align: center;
}
.trade-slot:hover { border-color: #3d4456; }
.trade-slot.empty {
  border: 1px dashed #303544;
  background: #11141c;
  color: #727988;
  font-size: 11px;
  font-weight: bold;
}
.trade-slot .slot-emoji { font-size: 26px; margin-bottom: 2px; }
.trade-slot .slot-name { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; color: #d0d5df; }
.trade-slot .slot-val { font-size: 11px; font-weight: bold; color: #ffdc65; }

/* Picker Grid */
.calc-picker-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  max-height: 300px;
  overflow-y: auto;
  background: #090b10;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #292e3b;
  margin-top: 10px;
}
.calc-picker-item {
  background: #121620;
  border: 1px solid #292e3b;
  border-radius: 8px;
  padding: 8px;
  text-align: center;
  cursor: pointer;
}
.calc-picker-item:active { background: #202635; }

/* Summary Card */
.trade-summary-card {
  background: #121620;
  border: 1px solid #292e3b;
  border-radius: 12px;
  padding: 16px;
  margin-top: 12px;
  text-align: center;
}
.outcome-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 8px;
}
.badge-loss { background: rgba(240, 68, 68, 0.15); color: #f04444; border: 1px solid #f04444; }
.badge-win { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; }
.badge-fair { background: rgba(241, 196, 15, 0.15); color: #f1c40f; border: 1px solid #f1c40f; }

.summary-diff {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 14px;
}
.summary-stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  background: #0d1017;
  border-radius: 8px;
  padding: 10px;
  border: 1px solid #212632;
  margin-bottom: 12px;
  text-align: left;
}
.summary-stat-box div:first-child { color: #8c93a3; font-size: 11px; text-transform: uppercase; }
.summary-stat-box div:last-child { color: white; font-size: 15px; font-weight: bold; margin-top: 2px; }

.comparison-bar-track {
  height: 8px;
  background: #232836;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
  display: flex;
}
.comparison-bar-fill {
  height: 100%;
  background: #f04444;
  transition: width 0.3s ease;
}

footer{text-align:center;padding:25px;color:#666d7c;font-size:12px}
@media(min-width:650px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head
